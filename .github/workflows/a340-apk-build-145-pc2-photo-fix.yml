name: Build Line Assistant 1.4.5-PC2 Photo Import Fix

on:
  push:
    branches: [ lineassistant-145-pc2-photo-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact 1.4.5 baseline + PC1 + PC2
        working-directory: a340-app
        shell: bash
        run: |
          python lineassistant_v111_runtime_patch.py
          python lineassistant_v120_pfr_patch.py
          python lineassistant_v130_pfr_strict_patch.py
          python lineassistant_v131_compile_fix.py
          python lineassistant_v132_version_patch.py
          python lineassistant_v133_output_cleanup_patch.py
          python lineassistant_v134_task_range_patch.py
          python lineassistant_v135_pfr_element_split_patch.py
          python lineassistant_v135_compile_fix.py
          python lineassistant_v136_universal_pfr_patch.py
          python lineassistant_v137_pfr_structured_editor_patch.py
          python lineassistant_v138_patchfix.py
          python lineassistant_v138_entrypoint_classification_patch.py
          python lineassistant_v139_exact_ecam_classification_patch.py
          python lineassistant_v140_cms_index_match_patch.py
          python lineassistant_v141_sections_manual_crop_patch.py
          python lineassistant_v141_compile_fix.py
          python lineassistant_v142_unified_ios_patch.py
          python lineassistant_v142_xml_fix.py
          python lineassistant_v143_crop_confirm_toolbar_patch.py
          python lineassistant_v144_cockpit_only_pfr_patch.py
          python lineassistant_v145_cms_candidate_selector_patch.py
          cd ..
          git apply --check --directory=a340-app a340-app/lineassistant_145_pc1.patch
          git apply --directory=a340-app a340-app/lineassistant_145_pc1.patch
          git apply --check --directory=a340-app a340-app/lineassistant_145_pc2_photo_fix.patch
          git apply --directory=a340-app a340-app/lineassistant_145_pc2_photo_fix.patch

      - name: Verify photo path and parser invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('a340-app')
          gradle=(root/'app/build.gradle.kts').read_text()
          engine=(root/'app/src/main/java/com/a340/technicalassistant/LineAssistantEngine.kt').read_text()
          activity=root/'app/src/main/java/com/a340/technicalassistant/LineAssistantActivity.kt'
          pfr=root/'app/src/main/java/com/a340/technicalassistant/PfrGeometryAnalyzerV2.kt'
          post=root/'app/src/main/java/com/a340/technicalassistant/PostFlightAnalyzer.kt'
          filepaths=root/'app/src/main/res/xml/file_paths.xml'
          atext=activity.read_text()
          ftext=filepaths.read_text()
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          checks={
            'version 1.4.5-PC2':'versionName = "1.4.5-PC2"' in gradle and 'versionCode = 47' in gradle,
            'PC1 possible causes extraction':'extractPossibleCauses' in engine,
            'PC1 possible causes IPC mapping':'ipcHitsForPossibleCause' in engine,
            'gallery uses OpenDocument':'ActivityResultContracts.OpenDocument()' in atext,
            'gallery cache copy':'cacheGalleryImage' in atext and 'IMAGE_IMPORT_OK' in atext,
            'gallery FileProvider path':'<cache-path name="gallery" path="gallery/" />' in ftext,
            'visible import error':'IMAGE IMPORT FAILED' in atext,
            'visible crop launch error':'CROP COULD NOT OPEN' in atext,
            'visible OCR image error':'OCR IMAGE OPEN FAILED' in atext,
            'old GetContent removed':'ActivityResultContracts.GetContent()' not in atext,
            'no 1.4.6 multipass':'PfrImagePreprocessor' not in atext,
            'no 1.5.x DB OCR corrector':'PfrDatabaseOcrCorrector' not in atext,
            'direct ML Kit OCR':'TextRecognition.getClient' in atext,
            'PFR geometry hash unchanged':sha(pfr)=='37ec455724a3a6071602dc187a224b2e673722194cf977785a8aa63ecb28da62',
            'PostFlightAnalyzer hash unchanged':sha(post)=='99a2fff778a1bc3512b2d38f627c5a568a2a627109bd7e3b7e1ff35964223860',
            'PC2 activity exact hash':sha(activity)=='87b7857463e9f6edae79330e0ada41967a2a777ee0026a00c68f61f616073a91',
            'PC2 file_paths exact hash':sha(filepaths)=='598f95b41cadf9a3d8f7f379b2ca28f03e61e4e55ba02b10b1ef291cb4e63079',
          }
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Verification failed: '+', '.join(bad))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Route Technical Master through bundled FTS5 SQLite
        shell: bash
        run: |
          FILE='a340-app/app/src/main/java/com/a340/technicalassistant/SearchRepository.kt'
          grep -q 'import android.database.sqlite.SQLiteDatabase' "$FILE"
          sed -i 's/import android.database.sqlite.SQLiteDatabase/import com.a340.technicalassistant.db.FtsSQLiteDatabase as SQLiteDatabase/' "$FILE"
          grep -q 'import com.a340.technicalassistant.db.FtsSQLiteDatabase as SQLiteDatabase' "$FILE"

      - name: Build debug APK
        working-directory: a340-app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK packaging
        shell: bash
        run: |
          unzip -l a340-app/app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'lib/arm64-v8a/.*sqlite.*\.so'
          test -s a340-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifacts
        shell: bash
        run: |
          cp a340-app/app/build/outputs/apk/debug/app-debug.apk LineAssistant-1.4.5-PC2.apk
          sha256sum LineAssistant-1.4.5-PC2.apk | tee LineAssistant-1.4.5-PC2.sha256
          rm -rf a340-app/.gradle a340-app/app/build a340-app/build a340-app/.idea
          rm -f a340-app/local.properties

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: LineAssistant-1.4.5-PC2-Source
          path: a340-app/
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LineAssistant-1.4.5-PC2
          path: |
            LineAssistant-1.4.5-PC2.apk
            LineAssistant-1.4.5-PC2.sha256
          if-no-files-found: error
