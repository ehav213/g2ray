name: Build Line Assistant APK

on:
  push:
    branches: [ a340-v7-local-llm ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Route Technical Master search through AndroidX bundled FTS5 SQLite
        shell: bash
        run: |
          FILE='a340-app/app/src/main/java/com/a340/technicalassistant/SearchRepository.kt'
          grep -q 'import android.database.sqlite.SQLiteDatabase' "$FILE"
          sed -i 's/import android.database.sqlite.SQLiteDatabase/import com.a340.technicalassistant.db.FtsSQLiteDatabase as SQLiteDatabase/' "$FILE"
          grep -q 'import com.a340.technicalassistant.db.FtsSQLiteDatabase as SQLiteDatabase' "$FILE"
      - name: Build debug APK
        working-directory: a340-app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify bundled SQLite native library
        shell: bash
        run: |
          unzip -l a340-app/app/build/outputs/apk/debug/app-debug.apk | grep -Ei 'lib/arm64-v8a/.*sqlite.*\.so'
      - name: Rename APK
        run: cp a340-app/app/build/outputs/apk/debug/app-debug.apk LineAssistant-1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LineAssistant-1.0.0
          path: LineAssistant-1.0.0.apk
          if-no-files-found: error
